# BoxLang Sublime Text Package — Test Configuration

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    fast: Fast unit tests (no I/O)
    slow: Slow tests (file I/O, threading)
    parser: Parser-related tests
    cli: CLI-dependent tests
    integration: Integration tests
    unit: Unit tests
addopts = -v --tb=short
