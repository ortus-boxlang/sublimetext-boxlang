<body>
<style>
body {
    margin: 0;
    padding: 0;
    background-color: ${side_color};
}
.container {
    margin-left: 3px;
    padding: 4px;
    padding-right: 10px;
    background-color: color(var(--background) blend(var(--foreground) 98%));
}
h1 {
    font-size: 1rem;
    margin: 4px 0;
    padding: 4px;
    background-color: color(var(--background) blend(var(--foreground) 95%));
    font-family: "SF Mono", Monaco, Menlo, "Cascadia Code", monospace;
}
h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 6px 0 2px;
    padding: 2px 4px;
    color: color(var(--foreground) blend(var(--background) 50%));
}
.card {
    margin: 4px 0;
    padding: 0;
    background-color: color(var(--background) blend(var(--foreground) 90%));
    border-radius: 3px;
}
.card-header {
    margin: 0;
    padding: 4px;
    background-color: color(var(--background) blend(var(--foreground) 85%));
    border-radius: 3px 3px 0 0;
    font-family: "SF Mono", Monaco, Menlo, "Cascadia Code", monospace;
    font-size: 0.85rem;
}
.card-header-empty {
    border-radius: 3px;
}
.card-body {
    margin: 0;
    padding: 4px;
    font-size: 0.85rem;
    line-height: 1.4;
}
.code {
    background-color: var(--background);
    color: var(--foreground);
    padding: 0 2px;
    border-radius: 2px;
    font-family: "SF Mono", Monaco, Menlo, "Cascadia Code", monospace;
    font-size: 0.8rem;
}
a {
    color: var(--bluish);
    text-decoration: none;
}
a:hover {
    text-decoration: underline;
}
.links {
    padding: 3px 4px;
    border-top: 1px solid color(var(--foreground) blend(var(--background) 20%));
    font-size: 0.8rem;
}
.pagination {
    padding: 2px 4px;
    text-align: center;
    border-top: 1px solid color(var(--foreground) blend(var(--background) 20%));
    font-size: 0.8rem;
    background-color: color(var(--background) blend(var(--foreground) 85%));
}
.pagination a {
    margin: 0 4px;
    color: var(--bluish);
}
.entity-name-class {
    ${entity_name_class}
}
.entity-name-function {
    ${entity_name_function}
}
.entity-name-tag-boxlang {
    ${entity_name_tag_boxlang}
}
.entity-other-attribute-name {
    ${entity_other_attribute-name}
}
.entity-other-inherited-class {
    ${entity_other_inherited-class}
}
.storage-modifier {
    ${storage_modifier}
}
.storage-type {
    ${storage_type}
}
.string-quoted {
    ${string_quoted}
}
.support-function {
    ${support_function}
}
.variable-language {
    ${variable_language}
}
.variable-parameter-function {
    ${variable_parameter_function}
}
.constant-language {
    ${constant_language}
}
</style>
<div class="container">
    <h1>${header}</h1>
    <div>${body}</div>
    <div>${links}</div>
</div>
${pagination}
</body>
