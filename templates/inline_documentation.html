<style>
    html {
        --side-color: {{side_color}};
        --header-bg: #1e1e1e;
        --body-bg: #2d2d2d;
        --text-color: #d4d4d4;
        --link-color: #4c9bb0;
        --code-bg: #1e1e1e;
    }
    body {
        padding: 0;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.9rem;
        color: var(--text-color);
        background-color: var(--body-bg);
    }
    .header {
        background-color: var(--header-bg);
        border-left: 3px solid var(--side-color);
        padding: 0.75rem 1rem;
        font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
        font-size: 0.85rem;
        color: #fff;
    }
    .body {
        padding: 0.75rem 1rem;
    }
    .body h2 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #888;
        margin-top: 0.5rem;
        margin-bottom: 0.25rem;
    }
    .card {
        background-color: var(--code-bg);
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        margin-bottom: 0.5rem;
    }
    .card-header {
        font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
        font-size: 0.8rem;
        color: #dcdcaa;
        margin-bottom: 0.25rem;
    }
    .card-body {
        font-size: 0.85rem;
        line-height: 1.4;
    }
    code {
        background-color: var(--code-bg);
        padding: 0.1rem 0.3rem;
        border-radius: 3px;
        font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
        font-size: 0.8rem;
    }
    a {
        color: var(--link-color);
        text-decoration: none;
    }
    a:hover {
        text-decoration: underline;
    }
    .links {
        padding: 0.5rem 1rem;
        border-top: 1px solid #333;
        font-size: 0.8rem;
    }
    .pagination {
        padding: 0.5rem 1rem;
        text-align: center;
        border-top: 1px solid #333;
        font-size: 0.8rem;
    }
    .pagination a {
        margin: 0 0.5rem;
    }
    .entity_name_function { color: #dcdcaa; }
    .entity_name_tag_boxlang { color: #569cd6; }
    .entity_other_attribute_name { color: #9cdcfe; }
    .storage_type { color: #4ec9b0; }
    .variable_parameter_function { color: #9cdcfe; }
    .keyword_other { color: #c586c0; }
</style>
<div class="header">{{header}}</div>
<div class="body">{{body}}</div>
<div class="links">{{links}}</div>
<div class="pagination">{{pagination}}</div>
