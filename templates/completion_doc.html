<style>
    html {
        --side-color: {{side_color}};
        --bg: #1e1e1e;
        --text: #d4d4d4;
    }
    body {
        padding: 0.5rem 0.75rem;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 0.8rem;
        color: var(--text);
        background-color: var(--bg);
        border-left: 2px solid var(--side-color);
    }
    .header {
        font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
        font-size: 0.75rem;
        color: #dcdcaa;
        margin-bottom: 0.25rem;
    }
    .body {
        font-size: 0.8rem;
        line-height: 1.3;
    }
    .arguments {
        font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
        font-size: 0.75rem;
        color: #9cdcfe;
        margin-top: 0.25rem;
    }
    .arguments .active {
        color: #fff;
        font-weight: bold;
    }
    .arguments .required {
        color: #dcdcaa;
    }
    .arguments .optional {
        color: #6a9955;
    }
    code {
        background-color: #2d2d2d;
        padding: 0.1rem 0.2rem;
        border-radius: 2px;
        font-size: 0.75rem;
    }
    .entity_name_function { color: #dcdcaa; }
    .storage_type { color: #4ec9b0; }
    .variable_parameter_function { color: #9cdcfe; }
</style>
<div class="header">{{header}}</div>
<div class="body">{{body}}</div>
<div class="arguments">{{arguments}}</div>
